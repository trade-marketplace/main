# Runs the four checks from AGENTS.md, then the end-to-end and accessibility tests, on every pull request and on main
# (#68, #287). A red check means the PR doesn't merge. Each check is its own step, so the failing one is shown by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # No secrets or database: the app builds and tests run without any env vars (see .env.example).

jobs:
  checks:
    # Branch protection: mark "Lint, typecheck, test, build" as the required check.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # On a PR this is GitHub's merge commit: its first parent is the base branch, so 2 commits are enough
          # to see what the PR changes.
          fetch-depth: 2
          persist-credentials: false

      # Docs-only PRs skip the heavy steps but the job still finishes green, so a required check never sits on
      # "waiting". (A workflow-level `paths-ignore` would skip the whole workflow and block those PRs.)
      # Pushes to main always run everything. If anything goes wrong here, everything runs.
      - name: Detect docs-only change
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "$files"
            echo "$files" | node scripts/ci/docs-only.mjs || {
              echo "The docs-only check failed; running every check."
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            }
          else
            echo "Couldn't list the changed files; running every check."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docs only, skipping checks
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only docs changed, so lint, typecheck, test, build and e2e were skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node (version from .nvmrc)
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        id: install
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      # Each check runs even if an earlier one failed, so one run shows every problem at once.
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      # Unit tests need no database yet. A throwaway Postgres service is added here with the first test that does.
      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # End-to-end and accessibility tests (#70, #287). They need the built app, so they only run when Build passed
      # (and so never on a docs-only PR). The browser is cached per Playwright version, so it's only downloaded
      # when the version changes.
      - name: Find Playwright version
        id: playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: browser-cache
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        id: browsers
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        # System libraries: GitHub's Ubuntu image already has everything headless Chromium needs (it ships Google
        # Chrome), so apt only runs if a library is really missing. apt's mirror is sometimes very slow: on one run
        # in #287 `--with-deps` spent 7 minutes downloading fonts and xvfb the tests don't use.
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          bins=$(find ~/.cache/ms-playwright -type f \
            \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \))
          if [ -z "$bins" ]; then
            missing="(couldn't find the Chromium binaries to check)"
          else
            missing=$(echo "$bins" | xargs ldd | grep "not found" || true)
          fi
          if [ -n "$missing" ]; then
            echo "Chromium is missing system libraries, installing them:"
            echo "$missing"
            npx playwright install-deps chromium
          else
            echo "Chromium's system libraries are already installed."
          fi

      # `npm run e2e` would build the app again, so run Playwright on the build from the step above.
      - name: End-to-end and accessibility
        id: e2e
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test

      # The HTML report (with traces and screenshots of each failed test) is attached to the run for 7 days.
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Summary
        if: ${{ !cancelled() && steps.changes.outputs.docs_only != 'true' }}
        run: |
          {
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Install | ${{ steps.install.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| E2E + accessibility | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
