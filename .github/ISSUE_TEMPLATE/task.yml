name: Task
description: One piece of work an agent or person can finish in one pull request.
type: Task
body:
  - type: markdown
    attributes:
      value: "Read AGENTS.md before starting. A task is done only when every box below is ticked."
  - type: textarea
    id: what
    attributes:
      label: What to build
      description: What, not how. Name the page, route, data or behaviour.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The user or business reason.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes. Each one must be true before the PR is opened.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: ifs
    attributes:
      label: What if…
      description: Edge cases, errors and odd situations this must handle.
      value: |
        - [ ] What if …
  - type: textarea
    id: design
    attributes:
      label: Design reference
      description: Page code / mockup key from docs/design/sitemap.json, states, animations.
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What must be tested automatically.
  - type: textarea
    id: notes
    attributes:
      label: Notes for whoever picks this up
      description: Files likely touched, code to port from the old repo, gotchas.
